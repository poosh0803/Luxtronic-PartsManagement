<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      .orders-container {
        margin-top: 40px;
      }
      #orders-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      #orders-table th, #orders-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      #orders-table th {
        background-color: #f2f2f2;
      }
      .parts-list {
        list-style-type: none;
        padding-left: 0;
      }
      .action-btn {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .action-btn:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">L</div>
            <span class="brand-name">Luxtronic</span>
            <span class="subtitle">Parts Management</span>
        </div>
    </header>
    <nav class="nav-bar">
        <a href="/new-order" class="nav-item">
            <i class="fas fa-plus"></i>
            <span class="nav-text">New Order</span>
        </a>
        <a href="/order-history" class="nav-item active">
            <i class="fas fa-history"></i>
            <span class="nav-text">Order History</span>
        </a>
        <a href="/inventory" class="nav-item">
            <i class="fas fa-boxes"></i>
            <span class="nav-text">Inventory</span>
        </a>
        <a href="/usage" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span class="nav-text">Usage</span>
        </a>
    </nav>
    <main class="main-content">
        <h1>Order History</h1>

        <div class="orders-container">
          <h2>All Orders</h2>
          <table id="orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Purpose</th>
                <th>Machine</th>
                <th>Parts</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Order data will be populated here -->
            </tbody>
          </table>
        </div>

    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const ordersTableBody = document.querySelector('#orders-table tbody');

        const fetchOrders = async () => {
          try {
            const response = await fetch('/api/orders/history');
            const orders = await response.json();

            ordersTableBody.innerHTML = ''; // Clear existing rows

            if (orders.length === 0) {
              ordersTableBody.innerHTML = '<tr><td colspan="7">No orders found.</td></tr>';
              return;
            }

            orders.forEach(order => {
              const row = document.createElement('tr');
              const partsList = order.parts.map(p => `<li>${p.part_name} (x${p.quantity})</li>`).join('');
              
              row.innerHTML = `
                <td>${order.order_id}</td>
                <td>${order.purpose}</td>
                <td>${order.machine_name}</td>
                <td><ul class="parts-list">${partsList}</ul></td>
                <td>${order.status}</td>
                <td>${new Date(order.created_at).toLocaleString()}</td>
                <td>
                  ${order.status !== 'delivered' ? 
                    `<button class="action-btn" data-order-id="${order.order_id}">Mark as Delivered</button>` : 
                    'Delivered'}
                </td>
              `;
              ordersTableBody.appendChild(row);
            });
          } catch (error) {
            console.error('Error fetching orders:', error);
            ordersTableBody.innerHTML = '<tr><td colspan="7">Error loading orders.</td></tr>';
          }
        };

        ordersTableBody.addEventListener('click', async (e) => {
          if (e.target.classList.contains('action-btn')) {
            const orderId = e.target.dataset.orderId;
            try {
              const response = await fetch(`/api/orders/${orderId}/status`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'delivered' })
              });

              if (response.ok) {
                // Refresh the order list to show the updated status
                fetchOrders();
              } else {
                const result = await response.json();
                alert(`Error: ${result.error}`);
              }
            } catch (error) {
              console.error('Error updating order status:', error);
              alert('An unexpected error occurred.');
            }
          }
        });

        // Fetch orders on page load
        fetchOrders();
      });
    </script>
</body>
</html>
