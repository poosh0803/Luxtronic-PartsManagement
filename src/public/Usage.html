<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">L</div>
            <span class="brand-name">Luxtronic</span>
            <span class="subtitle">Parts Management</span>
        </div>
    </header>
    <nav class="nav-bar">
        <a href="/new-order" class="nav-item">
            <i class="fas fa-plus"></i>
            <span class="nav-text">New Order</span>
        </a>
        <a href="/order-history" class="nav-item">
            <i class="fas fa-history"></i>
            <span class="nav-text">Order History</span>
        </a>
        <a href="/inventory" class="nav-item">
            <i class="fas fa-boxes"></i>
            <span class="nav-text">Inventory</span>
        </a>
        <a href="/usage" class="nav-item active">
            <i class="fas fa-chart-line"></i>
            <span class="nav-text">Usage</span>
        </a>
    </nav>
    <main class="main-content">
        <h1>Record Part Usage</h1>

        <div class="form-container">
          <h2>Record Part Usage</h2>
          <form id="usage-form">
            <div class="form-group">
              <label for="machine-select">Select Machine</label>
              <select id="machine-select" name="machine_id" required>
                <option value="">--Please choose a machine--</option>
              </select>
            </div>
            <div class="form-group">
              <label for="part-select">Select Part</label>
              <select id="part-select" name="machine_part_id" required>
                <option value="">--Please choose a part--</option>
              </select>
            </div>
            <div class="form-group">
              <label for="usage-purpose">Purpose</label>
              <input type="text" id="usage-purpose" name="purpose">
            </div>
            <div class="form-group">
              <label for="quantity-used">Quantity Used</label>
              <input type="number" id="quantity-used" name="quantity_used" required>
            </div>
            <button type="submit">Record Usage</button>
          </form>
          <div id="usage-response-message"></div>
        </div>

        <div class="history-container">
          <h2>Usage History</h2>
          <table id="usage-history-table">
            <thead>
              <tr>
                <th>Usage ID</th>
                <th>Machine Name</th>
                <th>Part Name</th>
                <th>Purpose</th>
                <th>Quantity Used</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              <!-- History rows will be inserted here -->
            </tbody>
          </table>
        </div>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const usageForm = document.getElementById('usage-form');
        const responseMessage = document.getElementById('usage-response-message');
        const machineSelect = document.getElementById('machine-select');
        const partSelect = document.getElementById('part-select');
        const usageHistoryTable = document.getElementById('usage-history-table').getElementsByTagName('tbody')[0];

        const fetchMachines = async () => {
            try {
                const response = await fetch('/api/machines');
                const machines = await response.json();
                machineSelect.innerHTML = '<option value="">--Please choose a machine--</option>';
                machines.forEach(machine => {
                    const option = document.createElement('option');
                    option.value = machine.id;
                    option.textContent = machine.name;
                    machineSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching machines:', error);
            }
        };

        const fetchUsageHistory = async () => {
            try {
                const response = await fetch('/api/usage/history');
                const history = await response.json();
                usageHistoryTable.innerHTML = ''; // Clear existing rows
                history.forEach(record => {
                    const row = usageHistoryTable.insertRow();
                    row.innerHTML = `
                        <td>${record.usage_id}</td>
                        <td>${record.machine_name}</td>
                        <td>${record.part_name}</td>
                        <td>${record.purpose}</td>
                        <td>${record.quantity_used}</td>
                        <td>${new Date(record.usage_date).toLocaleString()}</td>
                    `;
                });
            } catch (error) {
                console.error('Error fetching usage history:', error);
            }
        };

        machineSelect.addEventListener('change', async () => {
            const machineId = machineSelect.value;
            partSelect.innerHTML = '<option value="">--Please choose a part--</option>';
            if (!machineId) return;

            try {
                const response = await fetch(`/api/machines/${machineId}/parts`);
                const parts = await response.json();
                parts.forEach(part => {
                    const option = document.createElement('option');
                    option.value = part.id;
                    option.textContent = part.part_name;
                    partSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching parts:', error);
            }
        });
    
        usageForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          responseMessage.textContent = '';
    
          const formData = new FormData(usageForm);
          const usageData = {
            machine_id: formData.get('machine_id'),
            machine_part_id: formData.get('machine_part_id'),
            purpose: formData.get('purpose'),
            quantity_used: formData.get('quantity_used'),
          };
    
          try {
            const response = await fetch('/api/usage', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(usageData),
            });
    
            const result = await response.json();
    
            if (response.ok) {
              responseMessage.textContent = 'Usage recorded successfully!';
              usageForm.reset();
              partSelect.innerHTML = '<option value="">--Please choose a part--</option>';
              fetchUsageHistory(); // Refresh history
            } else {
              responseMessage.textContent = `Error: ${result.error}`;
            }
          } catch (error) {
            console.error('Error recording usage:', error);
            responseMessage.textContent = 'An unexpected error occurred.';
          }
        });

        // Fetch initial data on page load
        fetchMachines();
        fetchUsageHistory();
      });
    </script>
</body>
</html>
