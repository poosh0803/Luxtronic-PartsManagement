<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <div class="logo">L</div>
            <span class="brand-name">Luxtronic</span>
            <span class="subtitle">Parts Management</span>
        </div>
    </header>
    <nav class="nav-bar">
        <a href="/new-order" class="nav-item active">
            <i class="fas fa-plus"></i>
            <span class="nav-text">New Order</span>
        </a>
        <a href="/order-history" class="nav-item">
            <i class="fas fa-history"></i>
            <span class="nav-text">Order History</span>
        </a>
        <a href="/inventory" class="nav-item">
            <i class="fas fa-boxes"></i>
            <span class="nav-text">Inventory</span>
        </a>
        <a href="/usage" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span class="nav-text">Usage</span>
        </a>
    </nav>
    <main class="main-content">
        <h1>Create a New Order</h1>
        <form id="order-form">
          <h2>Order Details</h2>
          <div class="form-group">
            <label for="purpose">Purpose</label>
            <input type="text" id="purpose" name="purpose" required>
          </div>
          <div class="form-group">
            <label for="machine-select">Machine</label>
            <select id="machine-select" name="machine_id" required>
              <option value="">Select a machine</option>
            </select>
          </div>
          <div class="form-group">
            <label for="customer_mobile_number">Customer Mobile</label>
            <input type="text" id="customer_mobile_number" name="customer_mobile_number">
          </div>
          <div class="form-group">
            <label for="source">Source</label>
            <input type="text" id="source" name="source">
          </div>
        
          <h2>Parts</h2>
          <div id="parts-container">
            <!-- Part rows will be added here dynamically -->
          </div>
          <button type="button" id="add-part-btn">Add Part</button>
        
          <button type="submit">Create Order</button>
        </form>
        <div id="response-message"></div>
    </main>

    <script src="js/NewOrder.js"></script>
</body>
</html>
